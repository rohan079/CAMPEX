spring.application.name=lead-service

# Optional, git-ignored file for local secrets (see local.properties). Environment variables win over it.
spring.config.import=optional:file:./local.properties

# Spring's PostgreSQL driver requires a JDBC URL. Keep credentials in environment
# variables or the git-ignored local.properties file; never commit them here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# The React dashboard and the voice service both speak snake_case JSON.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
spring.flyway.baseline-on-migrate=true
# --- Application ---
app.environment=${ENVIRONMENT:development}
app.business-name=${BUSINESS_NAME:your business}
app.business-description=${BUSINESS_DESCRIPTION:}
app.business-timezone=${BUSINESS_TIMEZONE:Asia/Kolkata}
app.follow-up-call-days=${FOLLOW_UP_CALL_DAYS:7}
app.call-poll-seconds=${CALL_POLL_SECONDS:3}
app.dashboard-api-key=${DASHBOARD_API_KEY:}
app.ad-popup-token=${AD_POPUP_TOKEN:}
app.internal-service-key=${INTERNAL_SERVICE_KEY:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.whatsapp.verify-token=${META_VERIFY_TOKEN:}
app.whatsapp.app-secret=${META_APP_SECRET:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:vXX.X}
app.whatsapp.graph-base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}

app.voice-service-base-url=${VOICE_SERVICE_URL:http://localhost:8000}
app.voice-service-request-timeout-seconds=${VOICE_SERVICE_TIMEOUT_SECONDS:30}
app.voice-service-max-concurrent-calls=${VOICE_MAX_CONCURRENT_CALLS:1}
