spring.application.name=lead-service

# Optional, git-ignored file for local secrets (see local.properties). Environment variables win over it.
spring.config.import=optional:file:./local.properties

# Spring's PostgreSQL driver requires a JDBC URL. Keep credentials in environment
# variables or the git-ignored local.properties file; never commit them here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# The React dashboard and the voice service both speak snake_case JSON.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
spring.flyway.baseline-on-migrate=true
# --- Application ---
app.environment=${ENVIRONMENT}
app.business-name=${BUSINESS_NAME}
app.business-description=${BUSINESS_DESCRIPTION}
app.business-timezone=${BUSINESS_TIMEZONE:Asia/Kolkata}
app.follow-up-call-days=${FOLLOW_UP_CALL_DAYS:7}
app.call-poll-seconds=${CALL_POLL_SECONDS:3}
app.ad-popup-token=${AD_POPUP_TOKEN:}
app.internal-service-key=${INTERNAL_SERVICE_KEY:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

campex.admin.email=${CAMPEX_ADMIN_EMAIL:}
campex.admin.password-hash=${CAMPEX_ADMIN_PASSWORD_HASH:}
campex.admin.session-ttl-seconds=${CAMPEX_ADMIN_SESSION_TTL_SECONDS:28800}

campex.firebase.project-id=${FIREBASE_PROJECT_ID:campex-f3ada}
campex.firebase.api-key=${FIREBASE_WEB_API_KEY:}

meta.app-id=${META_APP_ID:}
meta.app-secret=${META_APP_SECRET:}
meta.oauth-redirect-uri=${META_OAUTH_REDIRECT_URI:}
meta.graph-api-version=${META_GRAPH_API_VERSION:v27.0}
meta.token-encryption-key=${META_TOKEN_ENCRYPTION_KEY:}
meta.frontend-redirect-url=${CAMPEX_FRONTEND_URL:}
meta.login-config-id=${META_LOGIN_CONFIG_ID:}
meta.oauth-scopes=${META_OAUTH_SCOPES:ads_management,ads_read,business_management,pages_show_list,pages_read_engagement,instagram_basic,instagram_manage_insights}

app.whatsapp.verify-token=${META_VERIFY_TOKEN}
app.whatsapp.app-secret=${META_APP_SECRET}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
app.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION}
app.whatsapp.graph-base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}

app.voice-service-base-url=${VOICE_SERVICE_URL:http://localhost:8000}
app.voice-service-request-timeout-seconds=${VOICE_SERVICE_TIMEOUT_SECONDS:30}
app.voice-service-max-concurrent-calls=${VOICE_MAX_CONCURRENT_CALLS:1}

# --- Phase 1: measurement foundation ---
# Comma-separated Firebase emails that may access every client. Everyone else needs a client_members row.
campex.access.platform-admin-emails=${CAMPEX_PLATFORM_ADMIN_EMAILS:}
# Meta Conversions API dispatch. Events are always stored; nothing is sent to Meta unless this is true.
campex.tracking.capi-enabled=${META_CAPI_ENABLED:false}
campex.tracking.capi-base-url=${META_CAPI_BASE_URL:https://graph.facebook.com}
campex.tracking.max-attempts=${META_CAPI_MAX_ATTEMPTS:8}
campex.tracking.base-backoff-seconds=${META_CAPI_BASE_BACKOFF_SECONDS:30}
campex.tracking.dispatch-batch-size=${META_CAPI_BATCH_SIZE:50}
campex.tracking.rate-limit-per-minute-per-ip=${TRACKING_RATE_LIMIT_PER_IP:120}
campex.tracking.rate-limit-per-minute-per-pixel=${TRACKING_RATE_LIMIT_PER_PIXEL:3000}
campex.tracking.retention-days=${TRACKING_RETENTION_DAYS:395}
campex.tracking.pii-retention-days=${TRACKING_PII_RETENTION_DAYS:30}

# --- Phase 2: performance intelligence (read-only towards Meta) ---
campex.performance.graph-base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
campex.performance.attribution-windows=${META_ATTRIBUTION_WINDOWS:7d_click,1d_view}
campex.performance.scheduled-sync-enabled=${PERFORMANCE_SYNC_ENABLED:true}
campex.performance.sync-lookback-days=${PERFORMANCE_SYNC_LOOKBACK_DAYS:28}
campex.performance.min-impressions=${PERFORMANCE_MIN_IMPRESSIONS:1000}
campex.performance.min-clicks=${PERFORMANCE_MIN_CLICKS:50}
campex.performance.min-conversions=${PERFORMANCE_MIN_CONVERSIONS:10}
campex.performance.anomaly-cooldown-hours=${ANOMALY_COOLDOWN_HOURS:24}

# Phase 3 automation rules. Level 4 (pre-approved pausing without a per-change approval) stays off unless set to true.
campex.automation.enabled=${AUTOMATION_ENABLED:true}
campex.automation.preapproved-actions-enabled=${AUTOMATION_PREAPPROVED_ACTIONS_ENABLED:false}
campex.automation.cron=${AUTOMATION_CRON:0 */15 * * * *}
